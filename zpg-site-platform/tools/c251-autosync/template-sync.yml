# Installed in luedersjason/c251-caledonia-portal as .github/workflows/template-sync.yml
# Source of truth: luedersjason/claude zpg-site-platform/tools/c251-autosync/template-sync.yml
# Playbook rule 12, enforced mechanically: C251 + C251 Utilities rebuild themselves from the shared
# ZPG template (public repo, no token needed) and push only when the built pages changed.
name: Template sync
on:
  schedule:
    - cron: '17 * * * *'      # hourly
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: template-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: c251-caledonia-portal
      - uses: actions/checkout@v4
        with:
          repository: luedersjason/claude
          ref: claude/gallant-allen-1vreeq
          path: claude
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build C251 from the template
        run: |
          cd claude/zpg-site-platform
          python3 tools/build_site.py c251 c251-utilities
          python3 tools/build_site.py --check c251 c251-utilities
      - name: Commit and push if changed
        run: |
          cd c251-caledonia-portal
          if [ -z "$(git status --porcelain)" ]; then echo "C251 already matches the template"; exit 0; fi
          SRC=$(git -C ../claude log -1 --format=%h)
          git config user.name "template-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Template sync from luedersjason/claude@${SRC}"
          git push
