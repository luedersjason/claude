<div class="panel" data-panel="{{id}}" hidden>
<section id="review">
  <header><span class="eyebrow">{{eyebrow}}</span><h2>{{title}}</h2>
  <p class="lede">Each item shows where the text is, the current wording, the proposed wording, and what Claude will produce once you accept it. Every button press saves right away; click it again to set the item back to open.</p></header>
  <div class="rtools"><span id="rcount"></span><span class="row"><button class="btn" type="button" id="rOpen">Expand all</button><button class="btn" type="button" id="rClose">Collapse all</button></span></div>
  <div id="rList"><p class="note">Loading…</p></div>
  <p class="note" id="rMsg"></p>
</section>
<section class="box"><span class="eyebrow">The work</span><p class="about">{{about}}</p></section>
</div>
